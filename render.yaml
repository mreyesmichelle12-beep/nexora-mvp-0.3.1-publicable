# Despliegue en Render (Blueprint). Requiere un plan con disco persistente (SQLite vive en /data).
services:
  - type: web
    name: nexora-mvp
    runtime: docker
    plan: starter
    healthCheckPath: /salud
    disk: { name: nexora-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATA_DIR, value: /data }
      - { key: TRUST_PROXY, value: "1" }
      - { key: APP_URL, sync: false }   # pon aquí la URL pública, p. ej. https://nexora-mvp.onrender.com
