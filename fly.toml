# Despliegue en Fly.io:  fly launch --no-deploy && fly volumes create nexora_data --size 1 && fly deploy
app = "nexora-mvp"
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  # APP_URL = "https://nexora-mvp.fly.dev"   (descomenta y ajusta)
[mounts]
  source = "nexora_data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/salud"
    interval = "30s"
    timeout = "5s"
